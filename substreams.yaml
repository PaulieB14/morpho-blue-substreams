specVersion: v0.1.0

package:
  name: morpho_blue_paulie
  version: v0.2.1
  description: >
    Morpho Blue + MetaMorpho Substreams. Composes StreamingFast's
    morpho-blue-substreams map_events for the Blue event tape, then adds what
    that package does not have: market params, market totals, per-user
    positions, MetaMorpho vault indexing, and an upsert SQL db_out shaped like
    the Morpho API. Accounting follows morpho-org/morpho-blue — including the
    silent fee-share mint on AccrueInterest and socialized bad debt.
  url: https://github.com/PaulieB14/morpho-blue-substreams
  image: assets/icon.png

imports:
  # StreamingFast's decoder is NOT on the Substreams registry (only source, in
  # streamingfast/substreams-chain-modules). We vendor a build of it so this
  # package is self-contained; `make vendor` regenerates it from source.
  morpho_sf: ./vendor/morpho-blue-substreams-v0.1.0.spkg
  database: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v4.0.0/substreams-sink-database-changes-v4.0.0.spkg
  # Carries sf.substreams.sink.sql.v1.Service, the message the `sink:` block
  # below is encoded into. Without this import `substreams pack` cannot resolve
  # the sink type ("could not find protobuf message type ... in bundled
  # protobuf descriptors"). protodefs-v1.0.7 is the only release that ships it.
  sql: https://github.com/streamingfast/substreams-sink-sql/releases/download/protodefs-v1.0.7/substreams-sink-sql-protodefs-v1.0.7.spkg

network: mainnet

protobuf:
  files:
    - morpho_paulie.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/morpho_blue_paulie.wasm

modules:
  # ── Blue admin events SF does not decode ──────────────────────────────────
  - name: map_blue_admin
    doc: >
      Decodes the Morpho Blue admin events the upstream decoder omits:
      SetFeeRecipient, SetFee, EnableIrm, EnableLltv and SetOwner.
    kind: map
    initialBlock: 18883124
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:morpho_paulie.v1.BlueAdminEvents

  - name: store_fee_recipient
    doc: >
      Current protocol fee recipient, keyed `fee_recipient`. Written at the
      event's log index so consumers can resolve it at a precise ordinal.
    kind: store
    initialBlock: 18883124
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_blue_admin

  - name: store_blue_config
    doc: >
      Protocol owner and the enabled IRM / LLTV sets (`owner`, `irm:{address}`,
      `lltv:{value}`). Append-only — Morpho has no disable.
    kind: store
    initialBlock: 18883124
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_blue_admin

  - name: store_market_fee
    doc: >
      Per-market fee in WAD, keyed `fee:{market_id}`.
    kind: store
    initialBlock: 18883124
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_blue_admin

  # ── Blue markets, totals and positions ────────────────────────────────────
  - name: store_market_params
    doc: >
      The immutable 5-tuple per market (loan token, collateral token, oracle,
      IRM, LLTV), keyed `mkt:{market_id}:params`.
    kind: store
    initialBlock: 18883124
    updatePolicy: set
    valueType: proto:morpho_paulie.v1.MarketParams
    inputs:
      - map: morpho_sf:map_events

  - name: store_market_totals
    doc: >
      Running supply/borrow assets and shares plus total collateral per market.
      Applies interest accrual and socialized bad debt in true log order.
    kind: store
    initialBlock: 18883124
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: morpho_sf:map_events

  # feeShares on AccrueInterest credit the CURRENT fee recipient, so positions
  # depend on the fee-recipient store (read at the event's own ordinal).
  - name: store_positions
    doc: >
      Per-user supply shares, borrow shares and collateral, keyed
      `pos:{market_id}:{user}:{field}`. Credits the silent AccrueInterest fee-share
      mint to the fee recipient in effect at that ordinal.
    kind: store
    initialBlock: 18883124
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: morpho_sf:map_events
      - store: store_fee_recipient
        mode: get

  # ── MetaMorpho ────────────────────────────────────────────────────────────
  - name: map_metamorpho_factory
    doc: >
      CreateMetaMorpho events from the MetaMorpho V1 and V1.1 factories.
    kind: map
    initialBlock: 18883124
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:morpho_paulie.v1.MetaMorphoEvents

  - name: store_vaults
    doc: >
      Vault metadata (asset, name, symbol, factory, initial owner) keyed
      `vault:{address}`.
    kind: store
    initialBlock: 18883124
    updatePolicy: set
    valueType: proto:morpho_paulie.v1.VaultMeta
    inputs:
      - map: map_metamorpho_factory

  - name: map_metamorpho_events
    doc: >
      Deposit, Withdraw and Transfer events restricted to addresses the factory
      actually created — these are generic ERC-4626/ERC-20 signatures, so the vault
      store is what makes them Morpho-specific.
    kind: map
    initialBlock: 18883124
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_vaults
        mode: get
      - map: map_metamorpho_factory
    output:
      type: proto:morpho_paulie.v1.MetaMorphoEvents

  - name: store_vault_positions
    doc: >
      Per-user vault share balances from mint/burn/transfer, keyed
      `vpos:{vault}:{user}`.
    kind: store
    initialBlock: 18883124
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_metamorpho_events

  - name: store_vault_totals
    doc: >
      Vault share supply (exact) and net deposited assets (principal only —
      excludes interest earned in the underlying Blue markets).
    kind: store
    initialBlock: 18883124
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_metamorpho_events

  - name: map_position_risk
    doc: >
      Per-position health factor priced with the market's own oracle (read over
      RPC at 1e36 scale), plus the liquidation economics: seizable collateral
      and the liquidation incentive factor. Health factor is also on the Morpho
      API; the liquidation economics are not.
    kind: map
    initialBlock: 18883124
    inputs:
      - source: sf.substreams.v1.Clock
      - map: morpho_sf:map_events
      - store: store_market_params
        mode: get
      - store: store_market_totals
        mode: get
      - store: store_positions
        mode: get
    output:
      type: proto:morpho_paulie.v1.PositionRisks

  - name: store_liquidatable
    doc: >
      Currently-known liquidatable positions, keyed `liq:{market_id}:{user}`.
      Only re-priced when an event touches the position, so a purely
      price-driven move into liquidation is not seen until the next touch.
    kind: store
    initialBlock: 18883124
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_position_risk

  - name: map_bad_debt
    doc: >
      Bad debt attributed to the borrower that produced it. The Morpho API
      reports bad debt per market only.
    kind: map
    initialBlock: 18883124
    inputs:
      - map: morpho_sf:map_events
    output:
      type: proto:morpho_paulie.v1.BadDebtEvents

  - name: store_bad_debt
    doc: >
      Cumulative realized bad debt per market and per borrower, including a
      per-borrower incident count.
    kind: store
    initialBlock: 18883124
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_bad_debt

  # ── SQL ───────────────────────────────────────────────────────────────────
  - name: db_out
    doc: >
      Upsert DatabaseChanges for markets, market_states, positions, vaults,
      vault_positions, vault_states and blue_config. Pair with schema.sql.
    kind: map
    initialBlock: 18883124
    inputs:
      - source: sf.substreams.v1.Clock
      - store: store_market_params
        mode: deltas
      - store: store_market_totals
        mode: deltas
      - store: store_positions
        mode: deltas
      - store: store_vaults
        mode: deltas
      - store: store_vault_positions
        mode: deltas
      - store: store_vault_totals
        mode: deltas
      - store: store_market_fee
        mode: deltas
      - store: store_blue_config
        mode: deltas
      - store: store_bad_debt
        mode: deltas
      - store: store_liquidatable
        mode: deltas
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

# Sink config so `substreams-sink-sql setup` (and the Hosted Sink) can apply
# schema.sql and create the cursors table straight from the published spkg.
#
# engine: postgres is load-bearing. db_out emits OPERATION_UPSERT, and postgres
# is the only dialect in substreams-sink-sql that implements it
# (INSERT ... ON CONFLICT DO UPDATE); ClickHouse rejects upserts outright.
sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
    schema: ./schema.sql
